name: Desktop Preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to package
        required: true
        default: main
      prerelease_tag:
        description: Optional prerelease tag; publishes macOS and Windows artifacts when set
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  mac-preview:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'desktop-preview')
    runs-on: macos-14
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Package iPix Preview for Apple Silicon
        run: pnpm exec electron-builder --config electron-builder.preview.cjs --mac dmg --arm64 --publish never
      - name: Smoke packaged iPix MCP bridge
        run: node tests/ux/packaged-mcp-smoke.e2e.mjs "release-preview/mac-arm64/iPix Preview.app"
      - uses: actions/upload-artifact@v4
        with:
          name: ipix-preview-mac-arm64
          path: release-preview/*.dmg
          if-no-files-found: error
          retention-days: 7

  windows-preview:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'desktop-preview')
    runs-on: windows-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Package iPix Preview for Windows
        run: pnpm exec electron-builder --config electron-builder.preview.cjs --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ipix-preview-windows-x64
          path: release-preview/*.exe
          if-no-files-found: error
          retention-days: 7

  publish-prerelease:
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease_tag != ''
    needs: [mac-preview, windows-preview]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.prerelease_tag }}
      SOURCE_SHA: ${{ needs.mac-preview.outputs.source_sha }}
      WINDOWS_SOURCE_SHA: ${{ needs.windows-preview.outputs.source_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ipix-preview-*
          path: prerelease
          merge-multiple: true
      - name: Stage, verify, and publish macOS and Windows prerelease
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(prerelease/*.dmg)
          exes=(prerelease/*.exe)
          [[ "$SOURCE_SHA" == "$WINDOWS_SOURCE_SHA" ]] || { echo "Platform source SHA mismatch" >&2; exit 1; }
          [[ ${#dmgs[@]} -eq 1 && ${#exes[@]} -eq 1 ]] || { echo "Expected exactly one DMG and one EXE" >&2; exit 1; }
          notes=$(cat <<EOF
          iPix GetToken model-service test build.

          - Fixes Qwen Image 2.0 Pro reference-image editing through the verified GetToken image endpoint.
          - Supports multiple independent GetToken credentials and stable Seedance 2.0 polling.
          - Includes Apple Silicon DMG and Windows x64 installer assets from the same source commit.
          - Upgrade note: quit and remove the old Nomi Preview app after installing iPix Preview; existing projects, settings, and credentials remain in the compatible data directory.
          - Source commit: $SOURCE_SHA
          - Build run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            target=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
            [[ "$draft" == "true" ]] || { echo "Refusing to mutate an already published release" >&2; exit 1; }
            [[ "$target" == "$SOURCE_SHA" ]] || { echo "Draft target SHA mismatch" >&2; exit 1; }
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].id' |
              while read -r asset_id; do [[ -z "$asset_id" ]] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"; done
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "iPix $RELEASE_TAG" --notes "$notes" --prerelease --draft
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "iPix $RELEASE_TAG" --notes "$notes" --prerelease --draft
          fi
          gh release upload "$RELEASE_TAG" "${dmgs[0]}" "${exes[0]}" --repo "$GITHUB_REPOSITORY"
          asset_count=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          has_dmg=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | endswith(".dmg")] | any')
          has_exe=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | endswith(".exe")] | any')
          [[ "$asset_count" == "2" && "$has_dmg" == "true" && "$has_exe" == "true" ]] || {
            echo "Draft asset verification failed" >&2; exit 1;
          }
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
